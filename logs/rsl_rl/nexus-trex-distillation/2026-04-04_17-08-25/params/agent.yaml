seed: 42
device: cuda:0
num_steps_per_env: 24
max_iterations: 8000
empirical_normalization: null
obs_groups:
  policy:
  - student_policy
  teacher:
  - teacher_policy
clip_actions: null
save_interval: 50
experiment_name: nexus-trex-distillation
run_name: ''
logger: tensorboard
neptune_project: isaaclab
wandb_project: isaaclab
resume: false
load_run: .*
load_checkpoint: model_.*.pt
class_name: DistillationRunner
policy:
  class_name: StudentTeacher
  init_noise_std: 0.3
  noise_std_type: scalar
  student_obs_normalization: false
  teacher_obs_normalization: false
  student_hidden_dims:
  - 512
  - 256
  - 128
  teacher_hidden_dims:
  - 512
  - 256
  - 128
  activation: elu
algorithm:
  class_name: Distillation
  num_learning_epochs: 6
  learning_rate: 0.001
  gradient_length: 24
  max_grad_norm: null
  optimizer: adam
  loss_type: mse
load_experiment: nexus-trex-basic-v0
